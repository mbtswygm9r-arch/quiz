<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz-Session</title>
  <style>
    :root { --text:#172033; --blue:#2563eb; --border:#d9dee8; --success:#15803d; --error:#b42318; }
    body { max-width:640px; margin:40px auto; padding:0 20px; font-family:Arial,sans-serif; color:var(--text); }
    .frageBox { padding:24px; border:1px solid var(--border); border-radius:12px; margin-bottom:24px; }
    .frageText { font-size:1.3rem; font-weight:bold; margin-bottom:16px; }
    .mediaBox { margin-bottom:16px; }
    .mediaBox img { max-width:100%; border-radius:8px; }
    .options { display:grid; gap:12px; }
    .option { padding:16px; border:1px solid var(--border); border-radius:8px; cursor:pointer; text-align:center; font-weight:bold; background:#fff; }
    .option:hover { background:#f0f4ff; }
    .option.correct { background:var(--success); color:#fff; border-color:var(--success); }
    .option.wrong { background:var(--error); color:#fff; border-color:var(--error); }
    .status { margin-top:16px; font-weight:bold; min-height:24px; }
    .status.erfolg { color:var(--success); }
    .status.fehler { color:var(--error); }
  </style>
</head>
<body>
  <h1>Quiz-Session</h1>
  <div id="loading">Lade Frage …</div>

  <section id="sessionBereich" style="display:none;">
    <section class="frageBox">
      <div class="frageText" id="frageText"></div>
      <div class="mediaBox" id="mediaBox"></div>
      <div class="options" id="options"></div>
      <div class="status" id="status"></div>
    </section>
  </section>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://deqgoakcxiijhcujzems.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wCAMvhqeluaumYlZ1XK1Dw_VKgo1WGT";
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const lobbyCode = (new URLSearchParams(window.location.search).get("lobby") || "").toUpperCase().trim();
    const loading = document.getElementById("loading");
    const sessionBereich = document.getElementById("sessionBereich");
    const frageText = document.getElementById("frageText");
    const mediaBox = document.getElementById("mediaBox");
    const options = document.getElementById("options");
    const status = document.getElementById("status");

    let aktuelleLobbyId = null;
    let aktuelleRunde = null;

    async function stelleAnonymenLoginSicher() {
      const { data: sessionData } = await supabase.auth.getSession();
      if (sessionData.session) return;
      const { error } = await supabase.auth.signInAnonymously();
      if (error) throw error;
    }

    async function ladeLobbyId() {
      if (!lobbyCode) return null;
      const { data, error } = await supabase
        .from("lobbies")
        .select("id")
        .eq("code", lobbyCode)
        .single();
      if (error || !data) return null;
      return data.id;
    }

    async function ladeSession() {
      if (!aktuelleLobbyId) return;

      // Aktive Runde laden
      const { data: runde, error: rundeError } = await supabase
        .from("rounds")
        .select("*")
        .eq("lobby_id", aktuelleLobbyId)
        .eq("status", "active")
        .order("started_at", { ascending: false })
        .limit(1)
        .single();

      if (rundeError || !runde) {
        loading.textContent = "Warte auf Host …";
        sessionBereich.style.display = "none";
        return;
      }

      aktuelleRunde = runde;

      // Frage laden
      const { data: frage, error: frageError } = await supabase
        .from("questions")
        .select("display_text, quiz_type")
        .eq("id", runde.question_id)
        .single();

      if (frageError || !frage) {
        loading.textContent = "Fehler beim Laden der Frage …";
        sessionBereich.style.display = "none";
        return;
      }

      // Antwortmöglichkeiten laden
      const { data: optionen, error: optionenError } = await supabase
        .from("question_options")
        .select("*")
        .eq("question_id", runde.question_id)
        .order("sort_order", { ascending: true });

      if (optionenError || !optionen) {
        loading.textContent = "Fehler beim Laden der Antworten …";
        sessionBereich.style.display = "none";
        return;
      }

      // Medien laden
      const { data: medien, error: medienError } = await supabase
        .from("question_media")
        .select("*")
        .eq("question_id", runde.question_id)
        .order("sort_order", { ascending: true });

      // UI aufbauen
      loading.style.display = "none";
      sessionBereich.style.display = "block";
      frageText.textContent = frage.display_text;

      // Medien anzeigen
      mediaBox.innerHTML = "";
      if (medien && medien.length > 0) {
        for (const medium of medien) {
          if (medium.media_type === "image") {
            const img = document.createElement("img");
            img.src = medium.media_url;
            img.alt = medium.caption || "Fragebild";
            mediaBox.appendChild(img);
          }
        }
      }

      // Antwortmöglichkeiten anzeigen
      options.innerHTML = "";
      for (const opt of optionen) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option";
        btn.textContent = opt.option_text;
        btn.addEventListener("click", async () => {
          // Antwort speichern
          status.className = "status";
          status.textContent = "Antwort wird gespeichert …";
          try {
            const { error } = await supabase.rpc("submit_answer", {
              p_round_id: runde.id,
              p_option_id: opt.id
            });
            if (error) throw error;
            if (opt.is_correct) {
              status.className = "status erfolg";
              status.textContent = "Richtig!";
              btn.classList.add("correct");
            } else {
              status.className = "status fehler";
              status.textContent = "Leider falsch.";
              btn.classList.add("wrong");
            }
          } catch (error) {
            status.className = "status fehler";
            status.textContent = `Fehler: ${error.message}`;
          }
        });
        options.appendChild(btn);
      }
    }

    async function init() {
      await stelleAnonymenLoginSicher();
      aktuelleLobbyId = await ladeLobbyId();
      if (!aktuelleLobbyId) {
        loading.textContent = "Ungültiger Lobby-Code.";
        return;
      }

      // Realtime-Subscription
      supabase.channel(`session-runden-${aktuelleLobbyId}`)
        .on("postgres_changes", { event:"*", schema:"public", table:"rounds", filter:`lobby_id=eq.${aktuelleLobbyId}` }, ladeSession)
        .subscribe();

      ladeSession();
    }

    init();
  </script>
</body>
</html>
