<script type="module">
  // ... (Imports und Variablen wie vorher) ...

  const VERSION = "v5";
  console.log(`[INIT][${VERSION}] Session-Skript geladen`);

  let aktuelleLobbyId = null;
  let aktuelleRunde = null;
  let aktuellerLobbyCode = null;
  let bereitsBeantwortet = false;

  // ... (stelleAnonymenLoginSicher und ladeLobbyId wie vorher) ...

  async function ladeSession() {
    console.log(`[SESSION][${VERSION}] ladeSession aufgerufen, aktuelleRunde:`, aktuelleRunde?.id);
    if (!aktuelleLobbyId) {
      console.log(`[SESSION][${VERSION}] ABBRUCH: keine Lobby-ID`);
      return;
    }

    console.log(`[SESSION][${VERSION}] Hole aktive Runde für Lobby:`, aktuelleLobbyId);
    const { data: runde, error: rundeError } = await supabase
      .from("rounds")
      .select("*")
      .eq("lobby_id", aktuelleLobbyId)
      .eq("status", "active")
      .order("started_at", { ascending: false })
      .limit(1)
      .single();

    console.log(`[SESSION][${VERSION}] Runde Ergebnis:`, runde, "Fehler:", rundeError || null);

    if (rundeError || !runde) {
      console.log(`[SESSION][${VERSION}] Keine aktive Runde gefunden`);
      loading.textContent = "Warte auf Host …";
      sessionBereich.style.display = "none";
      warteBereich.style.display = "none";
      return;
    }

    // Wenn Runde gewechselt hat, Reset
    if (aktuelleRunde?.id !== runde.id) {
      console.log(`[SESSION][${VERSION}] Neue Runde erkannt (${runde.id}), Reset`);
      bereitsBeantwortet = false;
      warteBereich.style.display = "none";
    }

    aktuelleRunde = runde;

    // Wenn bereits beantwortet, Warte-Bereich zeigen
    if (bereitsBeantwortet) {
      console.log(`[SESSION][${VERSION}] Bereits beantwortet, zeige Warte-Bereich`);
      sessionBereich.style.display = "none";
      warteBereich.style.display = "block";
      loading.style.display = "none";
      return;
    }

    // ... (Rest wie vorher: Frage, Optionen, Medien laden) ...
  }

  // ... (Rest des Scripts wie vorher) ...
</script>
