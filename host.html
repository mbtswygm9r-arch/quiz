<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deutschrapquiz – Host</title>
  <style>
    :root { --text:#172033; --blue:#2563eb; --border:#d9dee8; --error:#b42318; --success:#15803d; --disabled:#98a2b3; }
    body { max-width:760px; margin:40px auto; padding:0 20px; font-family:Arial,sans-serif; color:var(--text); }
    button { padding:12px 16px; border:0; border-radius:8px; background:var(--blue); color:#fff; font:inherit; font-weight:bold; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .lobby { display:none; margin-top:24px; padding:24px; border:1px solid var(--border); border-radius:12px; }
    .code { font-size:2.5rem; font-weight:bold; letter-spacing:.2em; }
    .link { overflow-wrap:anywhere; color:#1d4ed8; }
    .status { min-height:24px; margin-top:16px; font-weight:bold; }
    .fehler { color:var(--error); } .erfolg { color:var(--success); }
    li { margin:8px 0; }
    .aktionen { margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; }
    .startButton { background:var(--success); }
    .startButton:disabled { background:var(--disabled); }
    .frageButton { background:#7c3aed; }
    .frageButton:disabled { background:var(--disabled); }
    .frageBox { margin-top:24px; padding:16px; border:1px solid var(--border); border-radius:12px; display:none; }
    .frageBox h2 { margin:0 0 8px 0; font-size:1.2rem; }
    .frageBox p { margin:0; }
  </style>
</head>
<body>
  <h1>Quiz-Host</h1>
  <p>Erstelle eine Lobby. Teilnehmer treten anschließend über den Link bei.</p>
  <button id="lobbyErstellenButton" type="button">Lobby erstellen</button>
  <p id="status" class="status"></p>

  <section id="lobbyBereich" class="lobby">
    <p>Lobbycode</p>
    <div id="lobbyCode" class="code"></div>
    <h2>Teilnehmer-Link</h2>
    <p id="joinLink" class="link"></p>
    <h2>Teilnehmer (<span id="spielerAnzahl">0</span>/8)</h2>
    <ul id="spielerListe"></ul>

    <div class="aktionen">
      <button id="startButton" class="startButton" type="button" disabled>Quiz starten</button>
      <button id="frageButton" class="frageButton" type="button" disabled>Frage starten</button>
    </div>

    <section id="frageBereich" class="frageBox">
      <h2>Aktuelle Frage</h2>
      <p id="frageText"></p>
    </section>
  </section>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://deqgoakcxiijhcujzems.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wCAMvhqeluaumYlZ1XK1Dw_VKgo1WGT";
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const lobbyErstellenButton = document.getElementById("lobbyErstellenButton");
    const startButton = document.getElementById("startButton");
    const frageButton = document.getElementById("frageButton");
    const status = document.getElementById("status");
    const lobbyBereich = document.getElementById("lobbyBereich");
    const lobbyCodeAnzeige = document.getElementById("lobbyCode");
    const joinLinkAnzeige = document.getElementById("joinLink");
    const spielerAnzahl = document.getElementById("spielerAnzahl");
    const spielerListe = document.getElementById("spielerListe");
    const frageBereich = document.getElementById("frageBereich");
    const frageText = document.getElementById("frageText");
    let aktuelleLobby = null;
    let aktuelleRunde = null;

    console.log("[INIT] Skript geladen");

    async function stelleAnonymenLoginSicher() {
      console.log("[LOGIN] Prüfe Session ...");
      const { data: sessionData } = await supabase.auth.getSession();
      if (sessionData.session) {
        console.log("[LOGIN] Bereits angemeldet:", sessionData.session.user.id);
        return;
      }
      console.log("[LOGIN] Nicht angemeldet, versuche anonyme Anmeldung ...");
      const { error } = await supabase.auth.signInAnonymously();
      if (error) {
        console.error("[LOGIN] Fehler bei anonymer Anmeldung:", error);
        throw error;
      }
      console.log("[LOGIN] Anonym angemeldet");
    }

    function erstelleLobbyCode() {
      const zeichen = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let index = 0; index < 5; index += 1) {
        code += zeichen[Math.floor(Math.random() * zeichen.length)];
      }
      return code;
    }

    async function erstelleLobby() {
      console.log("[LOBBY] Erstellen gestartet");
      lobbyErstellenButton.disabled = true;
      status.className = "status";
      status.textContent = "Lobby wird erstellt ...";
      try {
        await stelleAnonymenLoginSicher();
        for (let versuch = 1; versuch <= 5; versuch += 1) {
          const code = erstelleLobbyCode();
          console.log(`[LOBBY] Versuch ${versuch} mit Code:`, code);
          const { data, error } = await supabase.rpc("create_lobby", { p_code: code });
          if (!error) {
            console.log("[LOBBY] Erfolgreich erstellt:", data);
            aktuelleLobby = data;
            zeigeLobby();
            abonniereSpieler();
            status.textContent = "Lobby ist bereit.";
            console.log("[LOBBY] Fertig, Lobby angezeigt und Subscriber gestartet");
            return;
          }
          console.warn("[LOBBY] Fehler beim Erstellen:", error);
          if (!error.message.includes("duplicate key") || versuch === 5) throw error;
        }
      } catch (error) {
        console.error("[LOBBY] Abbruch mit Fehler:", error);
        status.className = "status fehler";
        status.textContent = `Fehler beim Erstellen: ${error.message}`;
        lobbyErstellenButton.disabled = false;
      }
    }

    function zeigeLobby() {
      console.log("[UI] Lobby anzeigen");
      const joinUrl = new URL("join.html", window.location.href);
      joinUrl.searchParams.set("lobby", aktuelleLobby.code);
      lobbyCodeAnzeige.textContent = aktuelleLobby.code;
      joinLinkAnzeige.textContent = joinUrl.toString();
      lobbyBereich.style.display = "block";
    }

    async function ladeSpieler() {
      console.log("[SPIELER] Lade Spieler für Lobby:", aktuelleLobby?.id);
      const { data, error } = await supabase.from("players").select("display_name, score, joined_at").eq("lobby_id", aktuelleLobby.id).order("joined_at", { ascending:true });
      if (error) {
        console.error("[SPIELER] Fehler beim Laden:", error);
        status.className = "status fehler";
        status.textContent = `Teilnehmer konnten nicht geladen werden: ${error.message}`;
        return;
      }
      console.log("[SPIELER] Geladene Spieler:", data);
      spielerListe.innerHTML = "";
      spielerAnzahl.textContent = data.length;
      for (const spieler of data) {
        const element = document.createElement("li");
        element.textContent = `${spieler.display_name} – ${spieler.score} Punkte`;
        spielerListe.appendChild(element);
      }
      const disabled = data.length === 0 || aktuelleLobby.status !== "waiting";
      console.log("[UI] StartButton disabled setzen auf:", disabled, "weil Spieler:", data.length, "Status:", aktuelleLobby.status);
      startButton.disabled = disabled;
    }

    function abonniereSpieler() {
      console.log("[SUB] Subscriber einrichten für Lobby:", aktuelleLobby?.id);
      ladeSpieler();
      supabase.channel(`lobby-spieler-${aktuelleLobby.id}`).on("postgres_changes", { event:"*", schema:"public", table:"players", filter:`lobby_id=eq.${aktuelleLobby.id}` }, ladeSpieler).subscribe();
      console.log("[SUB] Spieler-Channel subscribed");
      supabase.channel(`lobby-status-${aktuelleLobby.id}`).on("postgres_changes", { event:"UPDATE", schema:"public", table:"lobbies", filter:`id=eq.${aktuelleLobby.id}` }, function() { console.log("[SUB] Lobby-Status Update empfangen"); ladeLobbyStatus(); }).subscribe();
      console.log("[SUB] Lobby-Status-Channel subscribed");
      supabase.channel(`lobby-runden-${aktuelleLobby.id}`).on("postgres_changes", { event:"*", schema:"public", table:"rounds", filter:`lobby_id=eq.${aktuelleLobby.id}` }, function(payload) {
        console.log("[SUB] Runde Event empfangen:", payload);
        ladeFrage();
      }).subscribe();
      console.log("[SUB] Runden-Channel subscribed");
    }

    async function ladeLobbyStatus() {
      console.log("[STATUS] Lobby-Status neu laden für:", aktuelleLobby?.id);
      const { data, error } = await supabase.from("lobbies").select("status").eq("id", aktuelleLobby.id).single();
      if (error || !data) {
        console.warn("[STATUS] Fehler oder keine Daten:", error);
        return;
      }
      console.log("[STATUS] Neuer Lobby-Status:", data.status);
      aktuelleLobby.status = data.status;
      startButton.disabled = aktuelleLobby.status !== "waiting";
      if (aktuelleLobby.status === "running" && aktuelleRunde) {
        console.log("[UI] FrageButton aktivieren wegen Status running + vorhandener Runde");
        frageButton.disabled = false;
      }
    }

    async function ladeFrage() {
      console.log("[FRAGE] ladeFrage aufgerufen für Lobby:", aktuelleLobby?.id);
      if (!aktuelleLobby) {
        console.log("[FRAGE] ABBRUCH: keine aktuelle Lobby");
        return;
      }

      console.log("[FRAGE] Hole aktive Runde ...");
      const { data: runde, error: rundeError } = await supabase
        .from("rounds")
        .select("*")
        .eq("lobby_id", aktuelleLobby.id)
        .eq("status", "active")
        .order("started_at", { ascending: false })
        .limit(1)
        .single();

      console.log("[FRAGE] Runde Ergebnis:", runde, "Fehler:", rundeError || null);

      if (rundeError || !runde) {
        console.log("[FRAGE] Keine aktive Runde gefunden, Frage-Bereich ausblenden");
        frageBereich.style.display = "none";
        aktuelleRunde = null;
        return;
      }

      console.log("[FRAGE] Hole Frage-Daten für question_id:", runde.question_id);
      const { data: frage, error: frageError } = await supabase
        .from("questions")
        .select("question_text, question_type")
        .eq("id", runde.question_id)
        .single();

      console.log("[FRAGE] Frage Ergebnis:", frage, "Fehler:", frageError || null);

      if (frageError || !frage) {
        console.log("[FRAGE] Frage nicht gefunden, Frage-Bereich ausblenden");
        frageBereich.style.display = "none";
        aktuelleRunde = null;
        return;
      }

      aktuelleRunde = { ...runde, questions: frage };
      frageBereich.style.display = "block";
      frageText.textContent = frage.question_text || "Frage wird geladen …";
      console.log("[FRAGE] Frage-Bereich aktualisiert:", frage.question_text);

      if (aktuelleLobby.status === "running") {
        console.log("[UI] FrageButton aktivieren wegen running + geladener Frage");
        frageButton.disabled = false;
      }
    }

    async function starteQuiz() {
      console.log("[QUIZ] starteQuiz aufgerufen");
      console.log("[QUIZ] aktuelleLobby:", aktuelleLobby);
      if (!aktuelleLobby || aktuelleLobby.status !== "waiting") {
        console.log("[QUIZ] ABBRUCH: Lobby fehlt oder Status nicht waiting");
        return;
      }
      startButton.disabled = true;
      status.className = "status";
      status.textContent = "Quiz wird gestartet ...";
      console.log("[QUIZ] RPC start_lobby aufrufen mit Code:", aktuelleLobby.code);
      try {
        const { data, error } = await supabase.rpc("start_lobby", { p_code: aktuelleLobby.code });
        if (error) {
          console.error("[QUIZ] Fehler von start_lobby:", error);
          throw error;
        }
        console.log("[QUIZ] start_lobby erfolgreich, neue Lobby-Daten:", data);
        aktuelleLobby = data;
        status.className = "status erfolg";
        status.textContent = "Das Quiz läuft.";
        startButton.disabled = true;

        console.log("[QUIZ] ladeFrage nach Start aufrufen");
        ladeFrage();
      } catch (error) {
        console.error("[QUIZ] Exception in starteQuiz:", error);
        status.className = "status fehler";
        status.textContent = `Start nicht möglich: ${error.message}`;
        startButton.disabled = false;
      }
    }

    async function starteFrage() {
      console.log("[FRAGE-START] starteFrage aufgerufen");
      console.log("[FRAGE-START] aktuelleLobby:", aktuelleLobby);
      if (!aktuelleLobby || aktuelleLobby.status !== "running") {
        console.log("[FRAGE-START] ABBRUCH: Lobby fehlt oder Status nicht running");
        return;
      }
      frageButton.disabled = true;
      status.className = "status";
      status.textContent = "Frage wird gestartet ...";
      console.log("[FRAGE-START] RPC start_question aufrufen mit Lobby:", aktuelleLobby.id, "Frage:", "1fccb59c-8a4f-4854-8e7e-b5852f70c2be");
      try {
        const TESTFRAGE_ID = "1fccb59c-8a4f-4854-8e7e-b5852f70c2be";
        const { data, error } = await supabase.rpc("start_question", { p_lobby_id: aktuelleLobby.id, p_question_id: TESTFRAGE_ID });
        if (error) {
          console.error("[FRAGE-START] Fehler von start_question:", error);
          throw error;
        }
        console.log("[FRAGE-START] start_question erfolgreich, Runde:", data);
        aktuelleRunde = data;
        status.className = "status erfolg";
        status.textContent = "Frage läuft.";
        frageButton.disabled = true;

        console.log("[FRAGE-START] ladeFrage nach Start aufrufen");
        ladeFrage();
      } catch (error) {
        console.error("[FRAGE-START] Exception in starteFrage:", error);
        status.className = "status fehler";
        status.textContent = `Frage konnte nicht gestartet werden: ${error.message}`;
        frageButton.disabled = false;
      }
    }

    startButton.addEventListener("click", starteQuiz);
    console.log("[INIT] Event-Listener für Quiz starten registriert");
    frageButton.addEventListener("click", starteFrage);
    console.log("[INIT] Event-Listener für Frage starten registriert");
    lobbyErstellenButton.addEventListener("click", erstelleLobby);
    console.log("[INIT] Event-Listener für Lobby erstellen registriert");
  </script>
</body>
</html>
