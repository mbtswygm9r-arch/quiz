<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz – Host</title>
<style>
body{max-width:760px;margin:40px auto;padding:0 20px;font-family:Arial,sans-serif;color:#172033}
button{padding:12px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:inherit;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.box{margin-top:20px;padding:16px;border:1px solid #d9dee8;border-radius:12px}
.hidden{display:none}
.status{font-weight:bold;min-height:24px}
.error{color:#b42318}.success{color:#15803d}
.countdown{font-size:2rem;font-weight:bold;color:#b42318}
.antwort{padding:8px;border-bottom:1px solid #d9dee8}
.antwort:last-child{border-bottom:0}
.richtig{color:#15803d}.falsch{color:#b42318}
.richtigeAntwort{margin-top:12px;padding:12px;border-radius:8px;background:#f0fdf4;color:#15803d;font-weight:bold}
</style>
</head>
<body>
<h1>Quiz-Host v12.1</h1>
<button id="createLobby">Lobby erstellen</button>
<p id="status" class="status"></p>

<section id="lobby" class="box hidden">
<h2>Lobby <span id="lobbyCode"></span></h2>
<p id="joinLink"></p>
<ul id="players"></ul>
<button id="startQuiz" disabled>Quiz starten</button>
</section>

<section id="quiz" class="box hidden">
<h2>Frage <span id="questionNumber"></span>/3</h2>
<p id="questionText"></p>
<p class="countdown">Zeit: <span id="countdown">40</span> s</p>
<ul id="playerStatus"></ul>
<div id="reveal" class="hidden">
<div id="correctAnswer" class="richtigeAntwort"></div>
<div id="answers"></div>
<p id="nextIn"></p>
</div>
<button id="revealButton">Auflösen</button>
<button id="nextButton">Nächste Frage</button>
</section>

<section id="end" class="box hidden">
<h2>Quiz beendet</h2>
<p id="winner"></p>
<ol id="finalScores"></ol>
</section>

<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://deqgoakcxiijhcujzems.supabase.co","sb_publishable_wCAMvhqeluaumYlZ1XK1Dw_VKgo1WGT");
const $=id=>document.getElementById(id);
let lobby=null,round=null,questionTimer=null,nextTimer=null,remaining=40,paused=false,revealing=false,controlChannel=null;

function setStatus(t,c=""){const s=$("status");s.textContent=t;s.className="status "+c}
function show(id,on=true){$(id).classList.toggle("hidden",!on)}
async function login(){const{data:{session}}=await supabase.auth.getSession();if(!session)await supabase.auth.signInAnonymously()}
function code(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s}

async function createLobby(){
try{
await login();
for(let i=0;i<5;i++){
const{data,error}=await supabase.rpc("create_lobby",{p_code:code()});
if(!error){lobby=data;$("lobbyCode").textContent=lobby.code;const u=new URL("join.html",location.href);u.searchParams.set("lobby",lobby.code);$("joinLink").textContent=u;show("lobby");subscribe();setStatus("Lobby bereit","success");return}
if(!String(error.message).includes("duplicate"))throw error;
}
}catch(e){setStatus("Fehler: "+e.message,"error")}
}

async function loadPlayers(){
if(!lobby)return;
const{data:players}=await supabase.from("players").select("*").eq("lobby_id",lobby.id).order("score",{ascending:false}).order("joined_at");
$("players").innerHTML=players.map(p=>`<li>${p.display_name} – ${p.score} Pkt</li>`).join("");
$("startQuiz").disabled=!players.length||lobby.status!=="waiting";
if(!round){$("playerStatus").innerHTML=players.map(p=>`<li>${p.display_name} – ${p.score} Pkt</li>`).join("");return}
const{data:answers}=await supabase.from("player_answers").select("player_id").eq("round_id",round.id);
const answered=new Set(answers?.map(a=>a.player_id));
$("playerStatus").innerHTML=players.map(p=>`<li>${p.display_name} – ${p.score} Pkt ${answered.has(p.id)?"✓":"⏳"}</li>`).join("");
$("revealButton").disabled=Boolean(round.revealed_at);
if(players.length&&answered.size===players.length&&!round.revealed_at&&!revealing)await reveal();
}

async function loadQuestion(){
if(!lobby)return;
const{data:r}=await supabase.from("rounds").select("*").eq("lobby_id",lobby.id).eq("status","active").order("started_at",{ascending:false}).limit(1).maybeSingle();
if(!r){show("quiz",false);return}
round=r;revealing=false;
clearTimeout(nextTimer);
const{data:q}=await supabase.from("questions").select("*").eq("id",r.question_id).single();
const{data:all}=await supabase.from("rounds").select("id").eq("lobby_id",lobby.id);
$("questionNumber").textContent=all.length;
$("questionText").textContent=q.display_text;
$("reveal").classList.add("hidden");
$("nextButton").disabled=false;
$("revealButton").disabled=false;
show("quiz");
startQuestionTimer();
loadPlayers();
}

function startQuestionTimer(){
clearInterval(questionTimer);remaining=40;$("countdown").textContent=remaining;
questionTimer=setInterval(async()=>{
if(paused)return;
remaining--;$("countdown").textContent=remaining;
if(remaining<=0){clearInterval(questionTimer);if(round&&!round.revealed_at&&!revealing)await reveal()}
},1000);
}

function pauseTimers(){paused=true;clearInterval(questionTimer);clearTimeout(nextTimer);$("nextIn").textContent="Pausiert"}
function resumeTimers(){
paused=false;
if(round&&!round.revealed_at)startQuestionTimer();
else if(round?.revealed_at)startNextTimer();
}

function startNextTimer(){
clearTimeout(nextTimer);let t=5;$("nextIn").textContent=`Nächste Frage in ${t} Sekunden …`;
nextTimer=setInterval(()=>{
if(paused)return;
t--;$("nextIn").textContent=`Nächste Frage in ${t} Sekunden …`;
if(t<=0){clearInterval(nextTimer);nextQuestion()}
},1000);
}

async function reveal(){
if(!round||round.revealed_at||revealing)return;
revealing=true;clearInterval(questionTimer);$("revealButton").disabled=true;
try{
await supabase.rpc("vergebe_punkte",{p_round_id:round.id});
await supabase.rpc("reveal_round",{p_round_id:round.id});
round.revealed_at=new Date().toISOString();
const{data:options}=await supabase.from("question_options").select("*").eq("question_id",round.question_id);
const correct=options.find(o=>o.is_correct);
$("correctAnswer").textContent="Richtige Antwort: "+correct.option_text;
const{data:answers}=await supabase.from("player_answers").select("*,players(display_name),question_options(option_text,is_correct)").eq("round_id",round.id);
$("answers").innerHTML=answers.map(a=>`<div class="antwort ${a.question_options.is_correct?"richtig":"falsch"}">${a.players.display_name}: ${a.question_options.option_text} ${a.question_options.is_correct?"✓":"✗"}</div>`).join("")||"<div class='antwort'>Keine Antworten.</div>";
show("reveal");
loadPlayers();
if(!paused)startNextTimer();
}catch(e){setStatus("Fehler: "+e.message,"error");$("revealButton").disabled=false}
revealing=false;
}

async function nextQuestion(){
if(!lobby)return;
clearInterval(questionTimer);clearTimeout(nextTimer);
const{data,error}=await supabase.rpc("next_question",{p_lobby_id:lobby.id});
if(error)return setStatus("Fehler: "+error.message,"error");
if(!data)return showEnd();
round=data;loadQuestion();
}

async function showEnd(){
clearInterval(questionTimer);clearTimeout(nextTimer);show("quiz",false);show("end");
const{data:players}=await supabase.from("players").select("*").eq("lobby_id",lobby.id).order("score",{ascending:false});
$("winner").textContent=players.length?`Sieger: ${players[0].display_name} mit ${players[0].score} Punkten`:"Kein Sieger.";
$("finalScores").innerHTML=players.map((p,i)=>`<li>${i+1}. ${p.display_name} – ${p.score} Pkt</li>`).join("");
}

function subscribe(){
supabase.channel("lobby-"+lobby.id).on("postgres_changes",{event:"*",schema:"public",table:"players",filter:`lobby_id=eq.${lobby.id}`},loadPlayers).subscribe();
supabase.channel("rounds-"+lobby.id).on("postgres_changes",{event:"*",schema:"public",table:"rounds",filter:`lobby_id=eq.${lobby.id}`},loadQuestion).subscribe();
supabase.channel("answers-"+lobby.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"player_answers"},p=>{if(p.new.round_id===round?.id)loadPlayers()}).subscribe();
supabase.channel("lobby-status-"+lobby.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"lobbies",filter:`id=eq.${lobby.id}`},p=>{if(p.new.status==="finished")showEnd()}).subscribe();
controlChannel=supabase.channel("control-"+lobby.id);
controlChannel.on("broadcast",{event:"control"},({payload})=>{
if(payload.action==="pause")pauseTimers();
if(payload.action==="resume")resumeTimers();
}).subscribe();
}

$("createLobby").onclick=createLobby;
$("startQuiz").onclick=async()=>{const{data,error}=await supabase.rpc("start_lobby",{p_code:lobby.code});if(!error){lobby=data;show("lobby",false);show("quiz");loadQuestion()}};
$("revealButton").onclick=reveal;
$("nextButton").onclick=nextQuestion;
</script>
</body>
</html>
