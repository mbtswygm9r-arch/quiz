<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deutschrapquiz – Host</title>
  <style>
    :root { --text:#172033; --blue:#2563eb; --border:#d9dee8; --error:#b42318; --success:#15803d; --disabled:#98a2b3; }
    body { max-width:760px; margin:40px auto; padding:0 20px; font-family:Arial,sans-serif; color:var(--text); }
    button { padding:12px 16px; border:0; border-radius:8px; background:var(--blue); color:#fff; font:inherit; font-weight:bold; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .lobby { display:none; margin-top:24px; padding:24px; border:1px solid var(--border); border-radius:12px; }
    .code { font-size:2.5rem; font-weight:bold; letter-spacing:.2em; }
    .link { overflow-wrap:anywhere; color:#1d4ed8; }
    .status { min-height:24px; margin-top:16px; font-weight:bold; }
    .fehler { color:var(--error); } .erfolg { color:var(--success); }
    li { margin:8px 0; }
    .aktionen { margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; }
    .startButton { background:var(--success); }
    .startButton:disabled { background:var(--disabled); }
    .frageButton { background:#7c3aed; }
    .frageButton:disabled { background:var(--disabled); }
    .frageBox { margin-top:24px; padding:16px; border:1px solid var(--border); border-radius:12px; display:none; }
    .frageBox h2 { margin:0 0 8px 0; font-size:1.2rem; }
    .frageBox p { margin:0; }
    .antwortenBox { margin-top:24px; padding:16px; border:1px solid var(--border); border-radius:12px; display:none; }
    .antwortenBox h2 { margin:0 0 12px 0; font-size:1.2rem; }
    .antwort { padding:8px; border-bottom:1px solid var(--border); }
    .antwort:last-child { border-bottom:none; }
    .antwort.richtig { color:var(--success); }
    .antwort.falsch { color:var(--error); }
  </style>
</head>
<body>
  <h1>Quiz-Host v6</h1>
  <p>Erstelle eine Lobby. Teilnehmer treten anschließend über den Link bei.</p>
  <button id="lobbyErstellenButton" type="button">Lobby erstellen</button>
  <p id="status" class="status"></p>

  <section id="lobbyBereich" class="lobby">
    <p>Lobbycode</p>
    <div id="lobbyCode" class="code"></div>
    <h2>Teilnehmer-Link</h2>
    <p id="joinLink" class="link"></p>
    <h2>Teilnehmer (<span id="spielerAnzahl">0</span>/8)</h2>
    <ul id="spielerListe"></ul>

    <div class="aktionen">
      <button id="startButton" class="startButton" type="button" disabled>Quiz starten</button>
      <button id="beendenButton" type="button" disabled>Session beenden</button>
    </div>

    <section id="frageBereich" class="frageBox">
      <h2>Aktuelle Frage</h2>
      <p id="frageText"></p>
    </section>

    <section id="antwortenBereich" class="antwortenBox">
      <h2>Antworten</h2>
      <div id="antwortenListe"></div>
    </section>
  </section>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://deqgoakcxiijhcujzems.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wCAMvhqeluaumYlZ1XK1Dw_VKgo1WGT";
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const lobbyErstellenButton = document.getElementById("lobbyErstellenButton");
    const startButton = document.getElementById("startButton");
    const beendenButton = document.getElementById("beendenButton");
    const status = document.getElementById("status");
    const lobbyBereich = document.getElementById("lobbyBereich");
    const lobbyCodeAnzeige = document.getElementById("lobbyCode");
    const joinLinkAnzeige = document.getElementById("joinLink");
    const spielerAnzahl = document.getElementById("spielerAnzahl");
    const spielerListe = document.getElementById("spielerListe");
    const frageBereich = document.getElementById("frageBereich");
    const frageText = document.getElementById("frageText");
    const antwortenBereich = document.getElementById("antwortenBereich");
    const antwortenListe = document.getElementById("antwortenListe");
    let aktuelleLobby = null;
    let aktuelleRunde = null;

    const VERSION = "v6";
    console.log(`[INIT][${VERSION}] Skript geladen`);

    async function stelleAnonymenLoginSicher() {
      console.log(`[LOGIN][${VERSION}] Prüfe Session ...`);
      const { data: sessionData } = await supabase.auth.getSession();
      if (sessionData.session) {
        console.log(`[LOGIN][${VERSION}] Bereits angemeldet:`, sessionData.session.user.id);
        return;
      }
      console.log(`[LOGIN][${VERSION}] Nicht angemeldet, versuche anonyme Anmeldung ...`);
      const { error } = await supabase.auth.signInAnonymously();
      if (error) {
        console.error(`[LOGIN][${VERSION}] Fehler bei anonymer Anmeldung:`, error);
        throw error;
      }
      console.log(`[LOGIN][${VERSION}] Anonym angemeldet`);
    }

    function erstelleLobbyCode() {
      const zeichen = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let index = 0; index < 5; index += 1) {
        code += zeichen[Math.floor(Math.random() * zeichen.length)];
      }
      return code;
    }

    async function erstelleLobby() {
      console.log(`[LOBBY][${VERSION}] Erstellen gestartet`);
      lobbyErstellenButton.disabled = true;
      status.className = "status";
      status.textContent = "Lobby wird erstellt ...";
      try {
        await stelleAnonymenLoginSicher();
        for (let versuch = 1; versuch <= 5; versuch += 1) {
          const code = erstelleLobbyCode();
          console.log(`[LOBBY][${VERSION}] Versuch ${versuch} mit Code:`, code);
          const { data, error } = await supabase.rpc("create_lobby", { p_code: code });
          if (!error) {
            console.log(`[LOBBY][${VERSION}] Erfolgreich erstellt:`, data);
            aktuelleLobby = data;
            zeigeLobby();
            abonniereSpieler();
            status.textContent = "Lobby ist bereit.";
            console.log(`[LOBBY][${VERSION}] Fertig, Lobby angezeigt und Subscriber gestartet`);
            return;
          }
          console.warn(`[LOBBY][${VERSION}] Fehler beim Erstellen:`, error);
          if (!error.message.includes("duplicate key") || versuch === 5) throw error;
        }
      } catch (error) {
        console.error(`[LOBBY][${VERSION}] Abbruch mit Fehler:`, error);
        status.className = "status fehler";
        status.textContent = `Fehler beim Erstellen: ${error.message}`;
        lobbyErstellenButton.disabled = false;
      }
    }

    function zeigeLobby() {
      console.log(`[UI][${VERSION}] Lobby anzeigen`);
      const joinUrl = new URL("session.html", window.location.href);
      joinUrl.searchParams.set("lobby", aktuelleLobby.code);
      lobbyCodeAnzeige.textContent = aktuelleLobby.code;
      joinLinkAnzeige.textContent = joinUrl.toString();
      lobbyBereich.style.display = "block";
    }

    async function ladeSpieler() {
      console.log(`[SPIELER][${VERSION}] Lade Spieler für Lobby:`, aktuelleLobby?.id);
      const { data, error } = await supabase.from("players").select("display_name, score, joined_at").eq("lobby_id", aktuelleLobby.id).order("joined_at", { ascending:true });
      if (error) {
        console.error(`[SPIELER][${VERSION}] Fehler beim Laden:`, error);
        status.className = "status fehler";
        status.textContent = `Teilnehmer konnten nicht geladen werden: ${error.message}`;
        return;
      }
      console.log(`[SPIELER][${VERSION}] Geladene Spieler:`, data);
      spielerListe.innerHTML = "";
      spielerAnzahl.textContent = data.length;
      for (const spieler of data) {
        const element = document.createElement("li");
        element.textContent = `${spieler.display_name} – ${spieler.score} Punkte`;
        spielerListe.appendChild(element);
      }
      const disabled = data.length === 0 || aktuelleLobby.status !== "waiting";
      console.log(`[UI][${VERSION}] StartButton disabled setzen auf:`, disabled, "weil Spieler:", data.length, "Status:", aktuelleLobby.status);
      startButton.disabled = disabled;
    }

    function abonniereSpieler() {
      console.log(`[SUB][${VERSION}] Subscriber einrichten für Lobby:`, aktuelleLobby?.id);
      ladeSpieler();
      supabase.channel(`lobby-spieler-${aktuelleLobby.id}`).on("postgres_changes", { event:"*", schema:"public", table:"players", filter:`lobby_id=eq.${aktuelleLobby.id}` }, ladeSpieler).subscribe();
      console.log(`[SUB][${VERSION}] Spieler-Channel subscribed`);
      supabase.channel(`lobby-status-${aktuelleLobby.id}`).on("postgres_changes", { event:"UPDATE", schema:"public", table:"lobbies", filter:`id=eq.${aktuelleLobby.id}` }, function() { console.log(`[SUB][${VERSION}] Lobby-Status Update empfangen`); ladeLobbyStatus(); }).subscribe();
      console.log(`[SUB][${VERSION}] Lobby-Status-Channel subscribed`);
      supabase.channel(`lobby-runden-${aktuelleLobby.id}`).on("postgres_changes", { event:"*", schema:"public", table:"rounds", filter:`lobby_id=eq.${aktuelleLobby.id}` }, function(payload) {
        console.log(`[SUB][${VERSION}] Runde Event empfangen:`, payload);
        ladeFrage();
        ladeAntworten();
      }).subscribe();
      console.log(`[SUB][${VERSION}] Runden-Channel subscribed`);
      supabase.channel(`lobby-antworten-${aktuelleLobby.id}`).on("postgres_changes", { event:"INSERT", schema:"public", table:"player_answers", filter:`round_id=eq.${aktuelleRunde?.id || '00000000-0000-0000-0000-000000000000'}` }, function() {
        console.log(`[SUB][${VERSION}] Neue Antwort empfangen`);
        ladeAntworten();
      }).subscribe();
      console.log(`[SUB][${VERSION}] Antworten-Channel subscribed`);
    }

    async function ladeLobbyStatus() {
      console.log(`[STATUS][${VERSION}] Lobby-Status neu laden für:`, aktuelleLobby?.id);
      const { data, error } = await supabase.from("lobbies").select("status").eq("id", aktuelleLobby.id).single();
      if (error || !data) {
        console.warn(`[STATUS][${VERSION}] Fehler oder keine Daten:`, error);
        return;
      }
      console.log(`[STATUS][${VERSION}] Neuer Lobby-Status:`, data.status);
      aktuelleLobby.status = data.status;
      startButton.disabled = aktuelleLobby.status !== "waiting";
    }

    async function ladeFrage() {
      console.log(`[FRAGE][${VERSION}] ladeFrage aufgerufen für Lobby:`, aktuelleLobby?.id);
      if (!aktuelleLobby) {
        console.log(`[FRAGE][${VERSION}] ABBRUCH: keine aktuelle Lobby`);
        return;
      }

      console.log(`[FRAGE][${VERSION}] Hole aktive Runde ...`);
      const { data: runde, error: rundeError } = await supabase
        .from("rounds")
        .select("*")
        .eq("lobby_id", aktuelleLobby.id)
        .eq("status", "active")
        .order("started_at", { ascending: false })
        .limit(1)
        .single();

      console.log(`[FRAGE][${VERSION}] Runde Ergebnis:`, runde, "Fehler:", rundeError || null);

      if (rundeError || !runde) {
        console.log(`[FRAGE][${VERSION}] Keine aktive Runde gefunden, Frage-Bereich ausblenden`);
        frageBereich.style.display = "none";
        aktuelleRunde = null;
        return;
      }

      aktuelleRunde = runde;

      console.log(`[FRAGE][${VERSION}] Hole Frage-Daten für question_id:`, runde.question_id);
      const { data: frage, error: frageError } = await supabase
        .from("questions")
        .select("display_text, quiz_type")
        .eq("id", runde.question_id)
        .single();

      console.log(`[FRAGE][${VERSION}] Frage Ergebnis:`, frage, "Fehler:", frageError || null);

      if (frageError || !frage) {
        console.log(`[FRAGE][${VERSION}] Frage nicht gefunden, Frage-Bereich ausblenden`);
        frageBereich.style.display = "none";
        return;
      }

      frageBereich.style.display = "block";
      frageText.textContent = frage.display_text || "Frage wird geladen …";
      console.log(`[FRAGE][${VERSION}] Frage-Bereich aktualisiert:`, frage.display_text);
    }

    async function ladeAntworten() {
      console.log(`[ANTWORTEN][${VERSION}] ladeAntworten aufgerufen`);
      if (!aktuelleRunde) {
        console.log(`[ANTWORTEN][${VERSION}] ABBRUCH: keine aktuelle Runde`);
        antwortenBereich.style.display = "none";
        return;
      }

      const { data: antworten, error: antwortenError } = await supabase
        .from("player_answers")
        .select("*, players(display_name), question_options(option_text, is_correct)")
        .eq("round_id", aktuelleRunde.id)
        .order("answered_at", { ascending: false });

      console.log(`[ANTWORTEN][${VERSION}] Antworten Ergebnis:`, antworten, "Fehler:", antwortenError || null);

      if (antwortenError || !antworten || antworten.length === 0) {
        console.log(`[ANTWORTEN][${VERSION}] Keine Antworten gefunden`);
        antwortenBereich.style.display = "none";
        return;
      }

      antwortenBereich.style.display = "block";
      antwortenListe.innerHTML = "";

      for (const antwort of antworten) {
        const div = document.createElement("div");
        div.className = "antwort " + (antwort.question_options?.is_correct ? "richtig" : "falsch");
        div.textContent = `${antwort.players?.display_name || "Unbekannt"}: ${antwort.question_options?.option_text || "?"} ${antwort.question_options?.is_correct ? "✓" : "✗"}`;
        antwortenListe.appendChild(div);
      }

      console.log(`[ANTWORTEN][${VERSION}] Antworten angezeigt:`, antworten.length);
    }

    async function starteQuiz() {
      console.log(`[QUIZ][${VERSION}] starteQuiz aufgerufen`);
      console.log(`[QUIZ][${VERSION}] aktuelleLobby:`, aktuelleLobby);
      if (!aktuelleLobby || aktuelleLobby.status !== "waiting") {
        console.log(`[QUIZ][${VERSION}] ABBRUCH: Lobby fehlt oder Status nicht waiting`);
        return;
      }
      startButton.disabled = true;
      beendenButton.disabled = true;
      status.className = "status";
      status.textContent = "Quiz wird gestartet ...";
      console.log(`[QUIZ][${VERSION}] RPC start_lobby aufrufen mit Code:`, aktuelleLobby.code);
      try {
        const { data, error } = await supabase.rpc("start_lobby", { p_code: aktuelleLobby.code });
        if (error) {
          console.error(`[QUIZ][${VERSION}] Fehler von start_lobby:`, error);
          throw error;
        }
        console.log(`[QUIZ][${VERSION}] start_lobby erfolgreich, neue Lobby-Daten:`, data);
        aktuelleLobby = data;
        status.className = "status erfolg";
        status.textContent = "Das Quiz läuft.";
        startButton.disabled = true;
        beendenButton.disabled = false;

        console.log(`[QUIZ][${VERSION}] Weiterleitung auf Session-Seite`);
        const sessionUrl = new URL("session.html", window.location.href);
        sessionUrl.searchParams.set("lobby", aktuelleLobby.code);
        window.location.href = sessionUrl.toString();
      } catch (error) {
        console.error(`[QUIZ][${VERSION}] Exception in starteQuiz:`, error);
        status.className = "status fehler";
        status.textContent = `Start nicht möglich: ${error.message}`;
        startButton.disabled = false;
      }
    }

    async function beendeSession() {
      console.log(`[ENDE][${VERSION}] beendeSession aufgerufen`);
      if (!aktuelleLobby) {
        console.log(`[ENDE][${VERSION}] ABBRUCH: keine Lobby`);
        return;
      }
      beendenButton.disabled = true;
      status.className = "status";
      status.textContent = "Session wird beendet ...";
      try {
        const { error } = await supabase.rpc("end_lobby", { p_code: aktuelleLobby.code });
        if (error) throw error;
        console.log(`[ENDE][${VERSION}] Session beendet`);
        status.className = "status erfolg";
        status.textContent = "Session beendet.";
        setTimeout(() => {
          window.location.href = "host.html";
        }, 1000);
      } catch (error) {
        console.error(`[ENDE][${VERSION}] Fehler:`, error);
        status.className = "status fehler";
        status.textContent = `Fehler: ${error.message}`;
        beendenButton.disabled = false;
      }
    }

    startButton.addEventListener("click", starteQuiz);
    console.log(`[INIT][${VERSION}] Event-Listener für Quiz starten registriert`);
    beendenButton.addEventListener("click", beendeSession);
    console.log(`[INIT][${VERSION}] Event-Listener für Session beenden registriert`);
    lobbyErstellenButton.addEventListener("click", erstelleLobby);
    console.log(`[INIT][${VERSION}] Event-Listener für Lobby erstellen registriert`);
  </script>
</body>
</html>
