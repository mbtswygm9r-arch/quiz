<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz – Session</title>
<style>
body{max-width:480px;margin:40px auto;padding:0 20px;font-family:Arial,sans-serif;text-align:center;color:#172033}
.box{margin-top:20px;padding:24px;border:1px solid #d9dee8;border-radius:12px}
.hidden{display:none}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:inherit;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.countdown{font-size:1.5rem;font-weight:bold;color:#b42318}
.richtig{color:#15803d}.falsch{color:#b42318}
.loesung{margin-top:12px;padding:12px;border-radius:8px;background:#f0fdf4;color:#15803d;font-weight:bold}
</style>
</head>
<body>
<h1>Quiz</h1>
<div id="loading" class="box">Lade Quiz …</div>
<div id="question" class="box hidden">
<p id="questionText"></p>
<p class="countdown">Zeit: <span id="countdown">40</span> s</p>
<div id="options"></div>
<button id="pauseButton">Pause</button>
</div>
<div id="waiting" class="box hidden">
<p>✓ Antwort gespeichert!</p>
<p>Warte auf Auflösung …</p>
<button id="pauseButtonWaiting">Pause</button>
</div>
<div id="result" class="box hidden">
<p id="resultText"></p>
<div id="solution" class="loesung"></div>
<p id="nextIn"></p>
<button id="pauseButtonResult">Pause</button>
</div>
<div id="finished" class="box hidden">
<h2>Quiz beendet</h2>
<p>Der Host zeigt jetzt den Sieger.</p>
</div>

<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://deqgoakcxiijhcujzems.supabase.co","sb_publishable_wCAMvhqeluaumYlZ1XK1Dw_VKgo1WGT");
const $=id=>document.getElementById(id);
let lobbyId=null,round=null,questionTimer=null,nextTimer=null,remaining=40,nextRemaining=5,answered=false,paused=false,controlChannel=null;

function show(id,on=true){$(id).classList.toggle("hidden",!on)}
function hideAll(){["loading","question","waiting","result","finished"].forEach(i=>show(i,false))}
async function login(){const{data:{session}}=await supabase.auth.getSession();if(!session)await supabase.auth.signInAnonymously()}

async function getLobby(){
const code=new URLSearchParams(location.search).get("lobby");
const{data}=await supabase.from("lobbies").select("id").eq("code",code).single();
lobbyId=data.id;
}

async function getPlayer(){
const{data:{session}}=await supabase.auth.getSession();
const{data}=await supabase.from("players").select("id").eq("lobby_id",lobbyId).eq("user_id",session.user.id).maybeSingle();
return data;
}

async function load(){
if(!lobbyId)return;
const{data:r}=await supabase.from("rounds").select("*").eq("lobby_id",lobbyId).eq("status","active").order("started_at",{ascending:false}).limit(1).maybeSingle();
if(!r){hideAll();$("loading").textContent="Warte auf Host …";show("loading");return}
if(round?.id!==r.id){answered=false;clearInterval(questionTimer);clearInterval(nextTimer)}
round=r;
if(r.revealed_at)return showResult(r);
if(answered){hideAll();show("waiting");return}
const{data:q}=await supabase.from("questions").select("*").eq("id",r.question_id).single();
const{data:options}=await supabase.from("question_options").select("*").eq("question_id",r.question_id).order("sort_order");
$("questionText").textContent=q.display_text;
$("options").innerHTML="";
options.forEach(o=>{
const b=document.createElement("button");b.textContent=o.option_text;
b.onclick=async()=>{b.disabled=true;const p=await getPlayer();if(!p)return;const{error}=await supabase.from("player_answers").insert({round_id:r.id,player_id:p.id,option_id:o.id});if(!error){answered=true;hideAll();show("waiting")}else b.disabled=false};
$("options").appendChild(b);
});
hideAll();show("question");startQuestionTimer();
}

function startQuestionTimer(){
clearInterval(questionTimer);let t=40;$("countdown").textContent=t;
questionTimer=setInterval(()=>{if(paused)return;t--;$("countdown").textContent=t;if(t<=0)clearInterval(questionTimer)},1000);
}

function startNextTimer(){
clearInterval(nextTimer);nextRemaining=5;$("nextIn").textContent=`Nächste Frage in ${nextRemaining} Sekunden …`;
nextTimer=setInterval(()=>{if(paused)return;nextRemaining--;$("nextIn").textContent=`Nächste Frage in ${nextRemaining} Sekunden …`;if(nextRemaining<=0)clearInterval(nextTimer)},1000);
}

function togglePause(){
paused=!paused;
["pauseButton","pauseButtonWaiting","pauseButtonResult"].forEach(id=>{const b=$(id);if(b)b.textContent=paused?"Weiter":"Pause"});
controlChannel?.send({type:"broadcast",event:"control",payload:{action:paused?"pause":"resume"}});
}

async function showResult(r){
clearInterval(questionTimer);
const p=await getPlayer();
const{data:options}=await supabase.from("question_options").select("*").eq("question_id",r.question_id);
const correct=options.find(o=>o.is_correct);
let mine=null;
if(p){const{data}=await supabase.from("player_answers").select("option_id").eq("round_id",r.id).eq("player_id",p.id).maybeSingle();mine=data}
const ok=mine&&correct&&mine.option_id===correct.id;
$("resultText").textContent=ok?"✓ Richtig!":"✗ Leider falsch.";
$("resultText").className=ok?"richtig":"falsch";
$("solution").textContent="Richtige Antwort: "+correct.option_text;
hideAll();show("result");
if(!paused)startNextTimer();
}

async function init(){
await login();await getLobby();await load();
supabase.channel("rounds-"+lobbyId).on("postgres_changes",{event:"*",schema:"public",table:"rounds",filter:`lobby_id=eq.${lobbyId}`},load).subscribe();
supabase.channel("lobby-"+lobbyId).on("postgres_changes",{event:"UPDATE",schema:"public",table:"lobbies",filter:`id=eq.${lobbyId}`},p=>{if(p.new.status==="finished"){clearInterval(questionTimer);clearInterval(nextTimer);hideAll();show("finished")}}).subscribe();
controlChannel=supabase.channel("control-"+lobbyId).subscribe();
["pauseButton","pauseButtonWaiting","pauseButtonResult"].forEach(id=>$(id)?.addEventListener("click",togglePause));
}
init();
</script>
</body>
</html>
